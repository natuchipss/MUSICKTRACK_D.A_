services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-musictrack_db}
      DB_USER: ${MYSQL_USER:-musictrack}
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-musictrack_db}
      MYSQL_USER: ${MYSQL_USER:-musictrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/musictrack_db.sql:/docker-entrypoint-initdb.d/001_musictrack_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
